[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "credit-monitoring"
version = "0.1.0"
description = "Reproducible credit-model data contracts, drift and observability demo"
requires-python = ">=3.11,<3.14"
dependencies = [
  "pandas>=2.2,<3", "scikit-learn>=1.5,<2", "pandera[pandas]>=0.24,<1",
  "evidently>=0.7,<0.8", "mlflow>=3,<4", "scipy>=1.14,<2",
  "psutil>=6,<8", "xlrd>=2,<3", "PyYAML>=6,<7",
  "joblib>=1.4,<2", "numpy>=2,<3",
]

[project.optional-dependencies]
dev = ["pytest>=8,<10", "ruff>=0.12,<1"]

[project.scripts]
credit-monitoring = "credit_monitoring.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I"]
